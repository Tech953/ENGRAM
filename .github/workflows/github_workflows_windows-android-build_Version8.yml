- name: Detect npm lockfile
  id: npm_lock
  shell: pwsh
  run: |
    if ((Test-Path "package-lock.json") -or (Test-Path "npm-shrinkwrap.json")) {
      "has_lock=true" >> $env:GITHUB_OUTPUT
    } else {
      "has_lock=false" >> $env:GITHUB_OUTPUT
    }

- name: Install dependencies
  shell: pwsh
  run: |
    if ((Test-Path "package-lock.json") -or (Test-Path "npm-shrinkwrap.json")) {
      npm ci
    } else {
      npm install
    }