name: Desktop & Android builds

# Builds the ENGRAM desktop app (Electron) on each native OS so the produced
# installers match their platform:
#   - ubuntu-latest  -> .AppImage + .deb
#   - macos-latest   -> .dmg
#   - windows-latest -> .exe (NSIS)
# and builds the ENGRAM mobile app (Expo) into an installable Android .apk on
# ubuntu (the `android` job below). All artifacts publish to the SAME GitHub
# Release for a tag, so the Download page (driven by /releases/latest) lists the
# desktop installers and the APK side by side.
#
# Code signing / notarization are opt-in: set the documented repository secrets
# and electron-builder picks them up automatically. With no secrets set, each
# OS still produces a working (unsigned) installer. The Android APK is
# debug-signed when no release keystore is configured — installable via sideload
# with no Expo account (see the android job for the in-place-update caveat).

on:
  workflow_dispatch: {}
  push:
    tags:
      - "v*"

concurrency:
  group: desktop-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    name: ${{ matrix.platform }}
    runs-on: ${{ matrix.os }}
    # Required so electron-builder's GitHub publisher can create the Release and
    # upload installers + update manifests using the default GITHUB_TOKEN.
    permissions:
      contents: write
    strategy:
      fail-fast: false
      matrix:
        include:
          - os: ubuntu-latest
            platform: linux
          - os: macos-latest
            platform: mac
          - os: windows-latest
            platform: win

    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --include=optional

      # On a tag push (v1.2.3) set the desktop package version to match the tag,
      # so the published release + update manifest carry the right version and
      # installed apps can tell a newer release apart. Non-tag (manual) runs keep
      # the package.json version as-is.
      - name: Sync desktop version from tag
        if: github.ref_type == 'tag'
        shell: bash
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          echo "Setting @workspace/desktop version to $VERSION"
          node -e "const f='artifacts/desktop/package.json';const fs=require('fs');const p=JSON.parse(fs.readFileSync(f));p.version=process.env.VERSION;fs.writeFileSync(f,JSON.stringify(p,null,2)+'\n');"
        env:
          VERSION: ${{ github.ref_name }}

      - name: Generate API client + Zod (codegen)
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Build shared libraries
        run: pnpm run typecheck:libs

      - name: Build API server bundle
        run: pnpm --filter @workspace/api-server run build

      - name: Build web dashboard
        env:
          PORT: "5000"
          BASE_PATH: "/"
          NODE_ENV: "production"
        run: pnpm --filter @workspace/engram run build

      - name: Build desktop main + stage resources
        run: pnpm --filter @workspace/desktop run build

      - name: Package installer (${{ matrix.platform }})
        env:
          # macOS signing + notarization (optional)
          CSC_LINK: ${{ secrets.CSC_LINK }}
          CSC_KEY_PASSWORD: ${{ secrets.CSC_KEY_PASSWORD }}
          # When no Developer ID cert is supplied, disable keychain identity
          # auto-discovery so the macOS runner produces a deterministic unsigned
          # build instead of hanging/failing on a missing/locked keychain. When a
          # cert IS supplied (CSC_LINK set) discovery is left on so signing works.
          CSC_IDENTITY_AUTO_DISCOVERY: ${{ secrets.CSC_LINK != '' }}
          APPLE_ID: ${{ secrets.APPLE_ID }}
          APPLE_APP_SPECIFIC_PASSWORD: ${{ secrets.APPLE_APP_SPECIFIC_PASSWORD }}
          APPLE_TEAM_ID: ${{ secrets.APPLE_TEAM_ID }}
          # Windows signing (optional)
          WIN_CSC_LINK: ${{ secrets.WIN_CSC_LINK }}
          WIN_CSC_KEY_PASSWORD: ${{ secrets.WIN_CSC_KEY_PASSWORD }}
          # Avoids GitHub API rate limits when electron-builder fetches tooling
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # Publishing is gated on the trigger being a `v*` tag push:
        #   - tag push  -> `--publish always`: uploads the installers + the
        #     *-latest*.yml update manifests (consumed by electron-updater in the
        #     installed app) to a *draft* GitHub Release for the pushed tag
        #     (releaseType: draft in electron-builder.yml). Each OS job uploads
        #     its own artifacts to the same draft; electron-builder
        #     de-duplicates safely. Because the release stays a draft, a
        #     partially-uploaded release is never publicly visible. The separate
        #     `publish` job below flips it to public once all three OS jobs are
        #     done.
        #   - manual run (workflow_dispatch) -> `--publish never`: only the
        #     workflow-artifact upload below runs, so manual builds never create
        #     an accidental Release.
        run: pnpm --filter @workspace/desktop exec electron-builder --${{ matrix.platform }} --publish ${{ github.ref_type == 'tag' && 'always' || 'never' }}

      # Confirm the packaged app actually LAUNCHES, not just that an installer was
      # produced. Launches the unpacked build via Playwright's Electron driver and
      # asserts: pglite.wasm/pglite.data shipped next to the server bundle, the
      # embedded server reaches /api/healthz, and the dashboard renders. A genuine
      # runtime break (stripped wasm, bad migrate/seed) fails the job here. On
      # Linux the Electron GUI needs a virtual display (xvfb).
      - name: Smoke test packaged app
        shell: bash
        run: |
          if [ "${{ matrix.platform }}" = "linux" ]; then
            sudo apt-get update
            sudo apt-get install -y xvfb
            xvfb-run -a pnpm --filter @workspace/desktop run smoke
          else
            pnpm --filter @workspace/desktop run smoke
          fi

      - name: Upload installers
        uses: actions/upload-artifact@v4
        with:
          name: engram-${{ matrix.platform }}
          if-no-files-found: error
          path: |
            artifacts/desktop/release/*.AppImage
            artifacts/desktop/release/*.deb
            artifacts/desktop/release/*.dmg
            artifacts/desktop/release/*.exe
            artifacts/desktop/release/*.zip

  # Build the Expo mobile app into an installable Android .apk and attach it to
  # the SAME release as the desktop installers. Runs after `build` so the draft
  # release electron-builder creates already exists; on a tag the APK is uploaded
  # into that draft (resolved by name, like the publish job) before the release
  # is un-drafted.
  #
  # Signing: with no release keystore, Gradle's assembleRelease falls back to the
  # Android debug signing config, so the APK is installable via sideload with no
  # secrets/Expo account. Caveat: a debug signature is NOT update-safe across
  # builds — installing a newer APK over an older one can require uninstalling
  # first. Wire a real keystore (via secrets) later if in-place updates matter.
  android:
    name: android
    needs: build
    runs-on: ubuntu-latest
    # Required so the GitHub token can upload the APK asset into the draft release.
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - name: Setup pnpm
        uses: pnpm/action-setup@v4
        with:
          version: 10

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: pnpm

      - name: Setup Java (JDK 17)
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Setup Android SDK
        uses: android-actions/setup-android@v3

      - name: Install dependencies
        run: pnpm install --frozen-lockfile --include=optional

      # Sync the mobile app version from the pushed tag (mirroring the desktop
      # version sync) and stamp an integer versionCode from the CI run number so
      # successive published builds are ordered. Exports APK_VERSION for the
      # artifact name. Non-tag (manual) runs keep app.json's current version.
      - name: Sync mobile version
        shell: bash
        env:
          REF_TYPE: ${{ github.ref_type }}
          REF_NAME: ${{ github.ref_name }}
          RUN_NUMBER: ${{ github.run_number }}
        run: |
          set -euo pipefail
          node -e '
            const fs = require("fs");
            const f = "artifacts/engram-mobile/app.json";
            const j = JSON.parse(fs.readFileSync(f, "utf8"));
            const current = j.expo.version || "1.0.0";
            const version =
              process.env.REF_TYPE === "tag"
                ? (process.env.REF_NAME || "").replace(/^v/, "")
                : current;
            j.expo.version = version;
            j.expo.android = j.expo.android || {};
            j.expo.android.versionCode = Number(process.env.RUN_NUMBER) || 1;
            fs.writeFileSync(f, JSON.stringify(j, null, 2) + "\n");
            fs.appendFileSync(process.env.GITHUB_ENV, "APK_VERSION=" + version + "\n");
            console.log("mobile version " + version + " (code " + j.expo.android.versionCode + ")");
          '

      # The mobile app imports the generated @workspace/api-client-react lib, so
      # generate it and emit the shared libs' dist before Metro bundles the
      # release JS during the Gradle build.
      - name: Generate API client + Zod (codegen)
        run: pnpm --filter @workspace/api-spec run codegen

      - name: Build shared libraries
        run: pnpm run typecheck:libs

      # Generate the native android/ project from app.json (gitignored output).
      # --no-install: deps already installed at the workspace root.
      # --clean: regenerate from a fresh template each run.
      - name: Expo prebuild (android)
        run: pnpm --filter @workspace/engram-mobile exec expo prebuild --platform android --no-install --clean

      - name: Build release APK
        working-directory: artifacts/engram-mobile/android
        run: |
          chmod +x ./gradlew
          ./gradlew :app:assembleRelease --no-daemon --stacktrace

      # Rename the Gradle output to a versioned asset name. The Download page
      # matches Android purely by the .apk extension.
      - name: Stage APK
        shell: bash
        run: |
          set -euo pipefail
          SRC="artifacts/engram-mobile/android/app/build/outputs/apk/release/app-release.apk"
          if [ ! -f "$SRC" ]; then
            echo "Expected APK not found at $SRC" >&2
            ls -la "artifacts/engram-mobile/android/app/build/outputs/apk/release/" || true
            exit 1
          fi
          mkdir -p artifacts/engram-mobile/dist-apk
          DEST="artifacts/engram-mobile/dist-apk/ENGRAM-Mobile-${APK_VERSION}.apk"
          cp "$SRC" "$DEST"
          echo "APK_PATH=$DEST" >> "$GITHUB_ENV"
          echo "Staged $DEST"

      - name: Upload APK artifact
        uses: actions/upload-artifact@v4
        with:
          name: engram-android
          if-no-files-found: error
          path: artifacts/engram-mobile/dist-apk/*.apk

      # On a tag push, attach the APK to the draft release electron-builder made.
      # The draft isn't tied to a real git tag yet, so resolve it by name (same
      # as the publish job), drop any same-named asset for idempotent re-runs,
      # then upload via the uploads API (gh release upload can't target a draft).
      - name: Publish APK to draft release
        if: github.ref_type == 'tag'
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Resolving draft release named '$TAG' in $REPO"
          RELEASE_ID="$(gh api "repos/$REPO/releases" --paginate \
            --jq ".[] | select(.draft == true and (.tag_name == \"$TAG\" or .name == \"$TAG\")) | .id" \
            | head -n1)"
          if [ -z "$RELEASE_ID" ]; then
            echo "No draft release found for tag '$TAG' (did the desktop build create it?)." >&2
            exit 1
          fi
          APK_NAME="$(basename "$APK_PATH")"
          echo "Draft release id $RELEASE_ID; uploading $APK_NAME"
          EXISTING="$(gh api "repos/$REPO/releases/$RELEASE_ID/assets" --paginate \
            --jq ".[] | select(.name == \"$APK_NAME\") | .id" | head -n1)"
          if [ -n "$EXISTING" ]; then
            echo "Removing existing asset id $EXISTING for an idempotent re-run"
            gh api -X DELETE "repos/$REPO/releases/assets/$EXISTING"
          fi
          curl --fail -sS \
            -X POST \
            -H "Authorization: Bearer $GH_TOKEN" \
            -H "Accept: application/vnd.github+json" \
            -H "Content-Type: application/vnd.android.package-archive" \
            --data-binary @"$APK_PATH" \
            "https://uploads.github.com/repos/$REPO/releases/$RELEASE_ID/assets?name=$APK_NAME"
          echo "APK uploaded to draft release."

  # On a manual workflow_dispatch run the desktop build uses `--publish never`
  # (no tag → no version for electron-builder to target), so the .zip and .apk
  # only exist as ephemeral workflow artifacts. This job downloads them all and
  # creates a GitHub pre-release so they are permanently, publicly downloadable
  # from the Releases page without a GitHub login.
  publish-dev:
    name: Publish dev pre-release
    needs: [build, android]
    if: github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Download all installers + APK
        uses: actions/download-artifact@v4
        with:
          pattern: engram-*
          path: release-assets
          merge-multiple: true

      - name: Create pre-release and upload assets
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
          RUN_NUMBER: ${{ github.run_number }}
          SHA: ${{ github.sha }}
        shell: bash
        run: |
          set -euo pipefail
          TAG="dev-build-${RUN_NUMBER}"
          echo "Creating pre-release '$TAG' in $REPO (target $SHA)"
          mapfile -t ASSETS < <(find release-assets -type f | sort)
          echo "Assets to upload:"
          printf '  %s\n' "${ASSETS[@]}"
          gh release create "$TAG" \
            --repo "$REPO" \
            --target "$SHA" \
            --title "Dev build #${RUN_NUMBER}" \
            --notes "Manual workflow_dispatch build. Commit: ${SHA}." \
            --prerelease \
            "${ASSETS[@]}"
          echo "Pre-release '$TAG' published."

  # Flip the draft Release to public only after ALL desktop build jobs AND the
  # android job have finished uploading their installers, the APK, + update
  # manifests, so users never land on a half-finished release. Runs only on a
  # `v*` tag push (the build jobs only create a draft on a tag); manual
  # (workflow_dispatch) runs publish nothing, so there is no draft to un-draft
  # and this job is skipped.
  publish:
    name: Publish release
    needs: [build, android]
    if: github.ref_type == 'tag'
    runs-on: ubuntu-latest
    # Required to flip the draft Release to public via the GitHub API.
    permissions:
      contents: write
    steps:
      # Find the draft Release for this tag and un-draft it. electron-builder
      # draft releases are not yet attached to a real git tag, so resolve the
      # draft by its name (electron-builder names it after the tag/version) and
      # edit that release id to draft=false. Setting draft=false makes the
      # release public; downloads need no GitHub login.
      - name: Un-draft the release
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          TAG: ${{ github.ref_name }}
          REPO: ${{ github.repository }}
        shell: bash
        run: |
          set -euo pipefail
          echo "Looking for draft release named '$TAG' in $REPO"
          RELEASE_ID="$(gh api "repos/$REPO/releases" --paginate \
            --jq ".[] | select(.draft == true and (.tag_name == \"$TAG\" or .name == \"$TAG\")) | .id" \
            | head -n1)"
          if [ -z "$RELEASE_ID" ]; then
            echo "No draft release found for tag '$TAG' — nothing to publish." >&2
            exit 1
          fi
          echo "Publishing draft release id $RELEASE_ID"
          gh api -X PATCH "repos/$REPO/releases/$RELEASE_ID" \
            -F draft=false \
            -f tag_name="$TAG" \
            -f make_latest=true >/dev/null
          echo "Release '$TAG' is now public."
