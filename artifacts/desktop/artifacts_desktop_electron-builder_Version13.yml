appId: ai.pyri.engram
productName: ENGRAM
executableName: engram
copyright: ENGRAM — PYRI AI Persona Framework

directories:
  output: dist
  buildResources: build

artifactName: ${productName}-${version}-${arch}.${ext}

generateUpdatesFilesForAllChannels: false

publish:
  provider: github
  owner: Tech953
  repo: ENGRAM
  releaseType: draft
  channel: latest
  vPrefixedTagName: true

npmRebuild: false
asar: true

files:
  - dist/**/*
  - package.json

extraResources:
  - from: resources/server
    to: server
  - from: resources/server/node_modules/@electric-sql/pglite
    to: server/node_modules/@electric-sql/pglite
  - from: resources/web
    to: web
  - from: resources/drizzle
    to: drizzle
  - from: resources/bin
    to: bin

linux:
  target:
    - AppImage
    - deb
  category: Science
  synopsis: PYRI — AI persona framework (offline-capable)

deb:
  depends:
    - libgtk-3-0
    - libnotify4
    - libnss3
    - libxss1
    - libxtst6
    - xdg-utils

mac:
  target:
    - dmg
  category: public.app-category.productivity
  hardenedRuntime: true
  gatekeeperAssess: false
  entitlements: build/entitlements.mac.plist
  entitlementsInherit: build/entitlements.mac.inherit.plist
  binaries:
    - Contents/Resources/bin/ffmpeg
    - Contents/Resources/bin/ffprobe
  notarize: true

win:
  target:
    - nsis
    - zip
  signtoolOptions:
    signingHashAlgorithms:
      - sha256
    rfc3161TimeStampServer: http://timestamp.digicert.com

nsis:
  oneClick: false
  perMachine: false
  allowToChangeInstallationDirectory: true
  createDesktopShortcut: true
  createStartMenuShortcut: true